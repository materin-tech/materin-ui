name: Docs site

# 文档 + 风格展示站点：https://materin-tech.github.io/materin-ui/
# 产物 docs-dist/ 不入库，由 CI 构建后作为 Pages 制品上传。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/**'
      - 'tokens/**'
      - 'registry/**'
      - 'tools/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 命名契约作为发布门禁：名字/清单/样式/令牌四者必须一致
      - name: Check naming contract
        run: python3 tools/check-components.py --repo .
      - name: Build docs
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
